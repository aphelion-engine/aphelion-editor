name: Bug report
description: Report a reproducible problem in Aphelion Editor.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Search existing issues first. Remove API keys, private media, and personal paths from attachments and logs."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and its impact on your editing workflow.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open...\n2. Add...\n3. Observe..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include editor version or commit, OS, installation method, and Python version for source builds. Include SDK/styling revisions if relevant.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, or a minimal example
      description: Redacted logs, a small graph, or screenshots help. Share only media you have permission to distribute.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed secrets and private information from this report.
          required: true
